<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>sending</title>
<script>
// Temporary helper: hands the scheduled post images to the Meta Business Suite tab that opened it. Remove after scheduling.
(async () => {
  const ok = ["https://business.facebook.com", "https://adsmanager.facebook.com", "https://ads.google.com"];
  if (!window.opener) { document.body.textContent = "no opener"; return; }
  const names = [];
  for (let i = 1; i <= 12; i++) names.push("ALA-post-" + String(i).padStart(2, "0") + ".jpg");
  for (const a of ["KeysYours", "PressS"]) for (const sz of ["1200x1200", "1200x628", "960x1200"]) names.push(`ALA-gads-${a}-${sz}.jpg`);
  const files = [];
  for (const n of names) files.push({ name: n, buf: await (await fetch(n, { cache: "no-store" })).arrayBuffer() });
  for (const o of ok) { try { window.opener.postMessage({ claudePosts: true, files }, o); } catch (e) {} }
  document.body.textContent = "sent";
  setTimeout(() => window.close(), 1500);
})();
</script>
